; mrhook - optional overrides. Delete this file and the defaults apply.
;
; DataPath and SavingPath answer the two registry reads
; Main_InitAndParseCommandLine makes at 0x00414100. The game prepends
; DataPath to every asset it opens, so it must be the folder that
; CONTAINS "DATA\", with a trailing backslash.
;
; Both default to the folder the DLL sits in, which is beside MOTO.EXE
; and is therefore already the install root. Set them only when the
; capture machine and the data tree are different folders.

[mrhook]
;DataPath=N:\DEV\MOTORACER\decomp\
;SavingPath=N:\DEV\MOTORACER\decomp\

; Anything the game does not recognise means English. The five it does
; recognise are FRENCH, GERMAN, ITALIAN, SPANISH and SWEDISH.
Language=ENGLISH

; NoD3D=1 forces the software renderer - the same switch as -NoD3D on
; the command line, without needing a command line. Set it on a machine
; where the 16-bit colour gate leaves the hardware path unusable and the
; game draws nothing; the software rasteriser still works there.
;
; It is written before the game's entry point runs, so nothing can
; overwrite it. The startup header says "NoD3D forced" when it fires.
;NoD3D=1

; RestartKey=0 turns off the "2" hotkey. On by default.
;
; Pressing 2 posts ESC then ENTER to the game window, which is
; what restarts the race from the pause menu - crash, press 2,
; test again, the same loop F1 gives on the port. It gets you to
; the grid and nothing more: the six-second countdown still runs
; unless tools/mr_cheats.py --on nocountdown has patched it out.
;
; F1 is not used here because MOTO binds it itself.
;RestartKey=0

; SideCamKey=0 turns off the "1" hotkey. On by default.
;
; Pressing 1 TOGGLES a 90-degree side view - the same key our
; port puts it on. It writes pi/2 into the live camera record,
; which is the game's own look-back (TAB, which writes pi)
; stopped half way, and it is the only angle the fork steering
; and the wheelie pivot can be seen from.
;
; It is re-asserted while on, so it survives a race restart.
; Pressing TAB while it is on fights it - same field.
;SideCamKey=0

; NoCountdown=1 starts every race immediately - no six-second
; grid wait. OFF by default, because it changes what MOTO does
; and every A/B measurement in this project is against MOTO.
;
; It zeroes the 0x1770 immediate at 0x004112a3, so
; maybe_Race_TickClock takes the timer negative on its first tick
; and the game starts the race itself - the lap state, the racer
; reset and the input gate all run exactly as they would have six
; seconds later. Nothing reimplements the start.
;
; It is the countdown, NOT the time limit, even though both live
; in 0x004dc0a8: the limit is written separately once the grid
; clears, so a patched race still has its full allowance.
;
; With the "2" key this is the whole retest loop - crash, press
; 2, you are already riding.
;NoCountdown=1

; MasterVolume turns the game down. 0 is silent, 32 is full - the
; range is the game's own and is read from the mixer at run time, so
; a value above it is clamped rather than refused. Absent, or -1,
; means the mixer is left exactly as the game set it.
;
; THIS MOVES THE WINDOWS MIXER, because that is what the game's own
; MASTER VOLUME option does - Settings_LoadAll hands the saved value
; to Mixer_SetVolume, which calls mixerSetControlDetails. The value
; is applied by calling that same function once the mixer is up, so
; nothing on the machine is written and the change lasts only for
; this run. The game's own saved level is untouched.
;
; There is no command-line equivalent; the game's own flag list ends
; at -FrameRateMax and -NoSound is all-or-nothing.
MasterVolume=1
;CDVolume=4
;WaveVolume=4

; ALL THREE LINES ARE SUPPORTED because master may not be the one
; that matters. On a modern Windows the legacy mixer master line
; does not necessarily attenuate an application own wave output,
; and the game effects - engine, voices, the glass crash - are
; waves. If MasterVolume alone does not quieten it, set WaveVolume.
;
; NOTE: while a line is set here the game own sound page cannot
; move that slider - the setting wins it back within 25 ms. Each
; line is off unless given a value.
